<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176b4d" />
    <meta name="description" content="La caisse simple, en ligne comme hors ligne." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="LoPOS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>LoPOS</title>
    <!-- Thème appliqué avant le premier rendu, sans flash blanc en sombre.
         Même clé et mêmes couleurs que src/theme.ts. -->
    <script>
      try {
        var pref = localStorage.getItem("lopos.theme")
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) {
          document.documentElement.dataset.theme = "dark"
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#121a16")
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
