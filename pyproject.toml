[project]
name = "lopos"
version = "0.1.0"
description = "Transactional POS backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "django-cors-headers>=4.4,<5",
    "django-unfold>=0.102,<0.103",
    "dj-database-url>=2.2,<3",
    "djangorestframework>=3.16,<3.17",
    "gunicorn>=23.0,<24",
    "posthog>=7.39.2",
    "psycopg[binary]>=3.2,<4",
    "sentry-sdk[django]>=2.68.0",
    "whitenoise>=6.7,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
